name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses and install platform 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Local checks (unit tests, lint, debug assemble)
        run: |
          ./gradlew --no-daemon --max-workers=2 \
            :app:testDebugUnitTest :app:lintDebug :app:assembleDebug \
            :wear:testDebugUnitTest :wear:lintDebug :wear:assembleDebug \
            :wear-diagnostics:lintDebug :wear-diagnostics:assembleDebug

      - name: Assemble debug androidTest APK
        run: ./gradlew --no-daemon :app:assembleDebugAndroidTest

      - name: Upload phone debug APK
        uses: actions/upload-artifact@v4
        with:
          name: emula-app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload phone debug androidTest APK
        uses: actions/upload-artifact@v4
        with:
          name: emula-app-debug-androidTest
          path: app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error

      - name: Upload wear debug APK
        uses: actions/upload-artifact@v4
        with:
          name: emula-wear-debug
          path: wear/build/outputs/apk/debug/wear-debug.apk
          if-no-files-found: warn

      - name: Upload wear-diagnostics debug APK
        uses: actions/upload-artifact@v4
        with:
          name: emula-wear-diagnostics-debug
          path: wear-diagnostics/build/outputs/apk/debug/wear-diagnostics-debug.apk
          if-no-files-found: warn

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: |
            app/build/reports/lint-results-debug.html
            wear/build/reports/lint-results-debug.html
            wear-diagnostics/build/reports/lint-results-debug.html
          if-no-files-found: ignore
